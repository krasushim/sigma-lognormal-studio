[project]
name = "sigma-lognormal-studio"
version = "1.0.0"
description = "Sigma-Lognormal Studio backend (Berio 2015 + 2025)"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python>=4.9",
  "scikit-image>=0.22",
  "torch>=2.2",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.api", "app.schemas", "sigma_lognormal"]
